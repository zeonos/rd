name: API server

on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "web/**", ".github/workflows/server.yml"]

# A newer push to the same branch or pull request cancels the older, now outdated build.
concurrency:
  group: api-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rd
          POSTGRES_PASSWORD: rd
          POSTGRES_DB: rdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # go.mod maps golang.org/x/* and gopkg.in/* to their GitHub mirrors, fetched directly.
      GOPROXY: direct
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          RD_TEST_DATABASE_URL: postgres://rd:rd@localhost:5432/rdtest?sslmode=disable
      - name: Docker build
        run: docker build -t rd-api .

  # The browser viewer bundle is committed (embedded in the API binary): check
  # it matches its sources and the .proto files.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g esbuild@0.28.2 typescript@6.0.3
      - run: web/build.sh
      - run: git diff --exit-code -- server/internal/webclient/static/app.js web/src/schema.json

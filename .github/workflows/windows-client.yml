# Builds the RD Windows client (forked RustDesk in client/) and packages it
# with the installer script. Adapted from client/.github/workflows/flutter-build.yml
# and bridge.yml (upstream 1.5.3), x64 only.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   RD_SERVER_KEY  contents of deploy/data/rustdesk/id_ed25519.pub on the server
#   RD_SERVER      optional, defaults to the value in client/rd/config.json
name: Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["client/**", "installer/**", ".github/workflows/windows-client.yml"]
  pull_request:
    paths: ["client/**", "installer/**", ".github/workflows/windows-client.yml"]

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  bridge:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          prefix-key: bridge

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generate bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: |
            client/src/bridge_generated.rs
            client/src/bridge_generated.io.rs
            client/flutter/lib/generated_bridge.dart
            client/flutter/lib/generated_bridge.freezed.dart

  windows:
    needs: bridge
    runs-on: windows-2022
    defaults:
      run:
        working-directory: client
    env:
      RD_SERVER_KEY: ${{ vars.RD_SERVER_KEY }}
      RD_SERVER: ${{ vars.RD_SERVER }}
    steps:
      - name: Export GitHub Actions cache variables (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4

      - name: Check server key
        shell: bash
        run: |
          if [ -z "$RD_SERVER_KEY" ] && ! grep -q '"key"' rd/config.json; then
            echo "::warning::RD_SERVER_KEY is not set - the client will not trust your server. Set the repository variable."
          fi

      - uses: actions/download-artifact@v4
        with:
          name: bridge
          path: client

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Use RustDesk's patched Flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          prefix-key: windows

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          New-Item -ItemType Directory -Force ../dist | Out-Null
          mv ./flutter/build/windows/x64/runner/Release ../dist/rd

      - name: Package
        working-directory: .
        shell: pwsh
        run: |
          Copy-Item installer/*.ps1 dist/
          Copy-Item installer/README.txt dist/
          Compress-Archive -Path dist/* -DestinationPath rd-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rd-windows-x64
          path: rd-windows-x64.zip
